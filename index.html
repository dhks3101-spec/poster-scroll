<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REVERSE 1999</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0d0a08;
    --bg-panel:#16181f;
    --bg-panel-2:#1d202a;
    --accent:#e3b23c;
    --accent-red:#c1432e;
    --text-primary:#f5f1e8;
    --text-muted:#8b8d97;
    --card-w: 210px;
    --card-h: 341.3px; /* 210 / (341/554), locked to the site's reference poster ratio */
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(ellipse at 50% 30%, #17110a 0%, var(--bg-deep) 55%);
    font-family:'Inter',sans-serif;
    color:var(--text-primary);
    overflow:hidden;
  }
  .stage{
    position:relative;
    width:100%; height:100vh; min-height:520px;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:24px 0;
  }
  .spotlight{
    position:absolute; top:50%; left:50%;
    width:520px; height:520px;
    transform:translate(-50%,-58%);
    background: radial-gradient(circle, rgba(196,108,56,.06) 0%, rgba(196,108,56,0) 70%);
    pointer-events:none;
    animation: breathe 5s ease-in-out infinite;
    z-index:0;
  }
  @keyframes breathe{ 0%,100%{ opacity:.7; } 50%{ opacity:1; } }

  .title-slot{
    position:relative;
    height:66px; max-width:460px; width:80%;
    margin:0 auto 24px auto;
    display:flex; align-items:center; justify-content:center;
    z-index:1;
  }
  .title-slot img{ max-height:100%; max-width:100%; object-fit:contain; display:block; }

  .viewport{
    position:relative;
    width:100%;
    max-width:1100px;
    height:calc(var(--card-h) + 90px);
    overflow-x:auto;
    overflow-y:hidden;
    scroll-snap-type: none;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    perspective:1200px;
    z-index:1;
    cursor:grab;
  }
  .viewport.dragging{ cursor:grabbing; user-select:none; }
  .viewport::-webkit-scrollbar{ display:none; }
  .track{
    display:flex;
    align-items:center;
    height:100%;
    padding-top: 42px;
  }
  .card{
    position:relative;
    flex:0 0 auto;
    width:var(--card-w);
    height:var(--card-h);
    margin-right:-58px;
    cursor:pointer;
    transform-origin:center center;
    transition:filter .25s ease;
    will-change:transform,filter,opacity;
  }
  .card:last-child{ margin-right:0; }
  .poster{
    position:relative;
    width:100%; height:100%;
    border-radius:6px;
    overflow:hidden;
    background:var(--bg-panel);
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  .poster img{
    width:100%; height:100%; object-fit:cover; display:block;
    pointer-events:none;
    -webkit-user-drag:none;
  }
  .poster .fallback{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:16px;
    background: linear-gradient(155deg, var(--bg-panel-2), var(--bg-panel));
    font-family:'Bebas Neue',sans-serif;
    font-size:20px; letter-spacing:.04em;
    color:var(--text-muted);
    pointer-events:none;
  }
  .caption{
    position:absolute; left:0; right:0; bottom:100%;
    margin-bottom:9px;
    opacity:0; transform:translateY(4px);
    transition:opacity .25s ease, transform .25s ease;
    pointer-events:none;
  }
  .card.is-center .caption{ opacity:1; transform:translateY(0); }
  .caption .cap-title{
    font-family:'Bebas Neue',sans-serif;
    font-size:15px; letter-spacing:.03em;
    color:var(--text-primary);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    text-shadow:0 1px 6px rgba(0,0,0,.6);
    display:block;
  }

  .hud{
    display:flex; flex-direction:column; align-items:center;
    gap:10px; margin-top:18px; z-index:1;
  }
  .scrollbar-track{
    position:relative;
    width:220px; height:3px;
    background:rgba(255,255,255,.12);
    border-radius:2px;
    overflow:hidden;
    cursor:pointer;
  }
  .scrollbar-thumb{
    position:absolute; top:0; left:0; height:100%;
    background:rgba(255,255,255,.5);
    border-radius:2px;
  }

  .status-msg{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    font-family:'JetBrains Mono',monospace;
    font-size:12px; color:var(--text-muted);
    text-align:center; line-height:1.8;
    z-index:2;
  }
  .status-msg.error{ color:var(--accent-red); }

  @media (prefers-reduced-motion: reduce){ .spotlight{ animation:none; } .card{ transition:none; } }
</style>
</head>

<script>
(function(){
  // ====== CONFIG ======
  // Leave these blank to auto-detect from the URL (works automatically once deployed
  // to GitHub Pages at https://<owner>.github.io/<repo>/). Only fill them in manually
  // if you're using a custom domain where auto-detection can't work.
  const REPO_OWNER = '';
  const REPO_NAME = '';
  const BRANCH_CANDIDATES = ['main', 'master'];
  const POSTERS_DIR = 'posters';

  function detectRepo(){
    if (REPO_OWNER && REPO_NAME) return { owner: REPO_OWNER, repo: REPO_NAME };
    const host = location.hostname; // e.g. "username.github.io"
    const owner = host.endsWith('.github.io') ? host.split('.')[0] : null;
    const pathParts = location.pathname.split('/').filter(Boolean);
    const repo = pathParts[0] || null;
    return { owner, repo };
  }

  const viewport = document.getElementById('viewport');
  const track = document.getElementById('track');
  const statusMsg = document.getElementById('statusMsg');
  const scrollbarTrack = document.getElementById('scrollbarTrack');
  const scrollbarThumb = document.getElementById('scrollbarThumb');

  let chapters = []; // { title, link, imageUrl }
  let centerIndex = 0;

  function naturalCompare(a, b){
    const na = parseFloat(a), nb = parseFloat(b);
    if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
    return a.localeCompare(b, 'ko');
  }

  async function fetchJson(url){
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }
  async function fetchText(url){
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.text();
  }

  async function discoverChapters(){
    const { owner, repo } = detectRepo();
    if (!owner || !repo){
      throw new Error('저장소 정보를 URL에서 자동으로 알아내지 못했어요.\n코드 상단 REPO_OWNER / REPO_NAME을 직접 채워주세요.');
    }

    let tree = null, branch = null;
    for (const b of BRANCH_CANDIDATES){
      try{
        const data = await fetchJson(`https://api.github.com/repos/${owner}/${repo}/git/trees/${b}?recursive=1`);
        tree = data.tree; branch = b;
        break;
      }catch(e){ /* try next branch candidate */ }
    }
    if (!tree) throw new Error('GitHub에서 폴더 목록을 가져오지 못했어요. (저장소/브랜치를 확인해 주세요)');

    // find every "posters/<folder>/제목.txt" to discover chapter folders,
    // and separately detect each folder's actual image filename/extension
    const prefix = POSTERS_DIR + '/';
    const folderSet = new Set();
    const imageFileMap = {}; // folder -> "이미지.png" / "이미지.jpg" / etc, whichever actually exists
    tree.forEach(item => {
      if (!item.path.startsWith(prefix)) return;
      const rest = item.path.slice(prefix.length);
      if (rest.endsWith('/제목.txt')){
        const folder = rest.slice(0, rest.length - '/제목.txt'.length);
        if (folder) folderSet.add(folder);
        return;
      }
      const m = rest.match(/^(.+)\/이미지\.(png|jpe?g|webp)$/i);
      if (m) imageFileMap[m[1]] = '이미지.' + m[2];
    });

    const folders = Array.from(folderSet).sort(naturalCompare);
    if (folders.length === 0){
      throw new Error(`"${POSTERS_DIR}/" 안에서 챕터 폴더를 찾지 못했어요.\n각 폴더 안에 제목.txt / 이미지.png(또는 .jpg)가 있는지 확인해 주세요.`);
    }

    const rawBase = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${prefix}`;
    const results = await Promise.all(folders.map(async (folder) => {
      let title = folder, link = '';
      try{
        const text = await fetchText(rawBase + encodeURIComponent(folder) + '/제목.txt');
        const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
        title = lines[0] || folder;
        link = lines[1] || '';
      }catch(e){ /* keep folder name as a fallback title */ }
      const imageFile = imageFileMap[folder] || '이미지.png';
      return {
        title, link,
        imageUrl: rawBase + encodeURIComponent(folder) + '/' + imageFile
      };
    }));

    return results;
  }

  function render(){
    track.innerHTML = '';
    chapters.forEach((ch, i) => {
      const card = document.createElement('div');
      card.className = 'card';

      const poster = document.createElement('div');
      poster.className = 'poster';
      const img = document.createElement('img');
      img.src = ch.imageUrl;
      img.alt = ch.title || '';
      img.onerror = () => {
        img.remove();
        const fb = document.createElement('div');
        fb.className = 'fallback';
        fb.textContent = ch.title || '이미지 없음';
        poster.prepend(fb);
      };
      poster.appendChild(img);
      card.appendChild(poster);

      const caption = document.createElement('div');
      caption.className = 'caption';
      const capTitle = document.createElement('span');
      capTitle.className = 'cap-title';
      capTitle.textContent = ch.title || '(제목 없음)';
      caption.appendChild(capTitle);
      card.appendChild(caption);

      card.addEventListener('click', () => onCardClick(card, i, ch.link));
      track.appendChild(card);
    });

    requestAnimationFrame(() => {
      setEdgePadding();
      updateVisuals();
      scrollToIndex(0, false);
    });
  }

  function setEdgePadding(){
    const vw = viewport.clientWidth;
    const cardW = 210;
    const padLeft = Math.max((vw - cardW) / 2, 20);
    const padRight = vw + cardW;
    track.style.paddingLeft = padLeft + 'px';
    track.style.paddingRight = padRight + 'px';

    const count = track.children.length;
    const flowWidth = count > 0 ? (count - 1) * (cardW - 58) + cardW : 0;
    track.style.width = (padLeft + flowWidth + padRight) + 'px';
  }

  function onCardClick(card, i, link){
    if (dragMoved) return;
    const isCenter = card.classList.contains('is-center');
    if (!isCenter){ goToIndex(i); return; }
    if (link){ window.open(link, '_blank', 'noopener'); }
  }

  function scrollToIndex(i, smooth){
    const cards = track.children;
    if (!cards[i]) return;
    const card = cards[i];
    const target = card.offsetLeft + card.offsetWidth/2 - viewport.clientWidth/2;
    viewport.scrollTo({ left: target, behavior: smooth ? 'smooth' : 'auto' });
  }
  function goToIndex(i, smooth){
    const clamped = Math.max(0, Math.min(i, track.children.length - 1));
    centerIndex = clamped;
    scrollToIndex(clamped, smooth !== false);
  }

  function updateVisuals(){
    const vpRect = viewport.getBoundingClientRect();
    const vpCenter = vpRect.left + vpRect.width/2;
    const cards = Array.from(track.children);
    let nearestDist = Infinity, nearestIdx = 0;

    cards.forEach((card, i) => {
      const r = card.getBoundingClientRect();
      const cCenter = r.left + r.width/2;
      const dist = (cCenter - vpCenter) / (r.width || 1);
      const absDist = Math.min(Math.abs(dist), 3);

      const scale = Math.max(1 - absDist*0.24, 0.55);
      const focusZone = 0.22;
      const blur = absDist <= focusZone ? 0 : Math.min((absDist - focusZone) * 3.2, 6);
      const opacity = Math.max(1 - absDist*0.32, 0.28);
      const z = Math.round(100 - absDist*10);

      card.style.transform = `scale(${scale})`;
      card.style.filter = `blur(${blur}px)`;
      card.style.opacity = opacity;
      card.style.zIndex = z;

      if (Math.abs(dist) < nearestDist){ nearestDist = Math.abs(dist); nearestIdx = i; }
      card.classList.toggle('is-center', Math.abs(dist) < 0.15);
    });

    centerIndex = nearestIdx;
    updateScrollbar();
  }

  function updateScrollbar(){
    const maxScroll = track.scrollWidth - viewport.clientWidth;
    const trackW = 220;
    const thumbRatio = maxScroll > 0 ? Math.min(viewport.clientWidth / track.scrollWidth, 1) : 1;
    const thumbW = Math.max(trackW * thumbRatio, 24);
    // Use the logical centered-poster index, not raw scroll pixels — the track has extra
    // right-side buffer (so the last poster can always reach true center), which would
    // otherwise leave the thumb short of 100% even while viewing the very last poster.
    const total = chapters.length;
    const scrollPct = total > 1 ? Math.min(Math.max(centerIndex / (total - 1), 0), 1) : 0;
    const thumbLeft = scrollPct * (trackW - thumbW);
    scrollbarThumb.style.width = thumbW + 'px';
    scrollbarThumb.style.left = thumbLeft + 'px';
  }
  scrollbarTrack.addEventListener('click', (e) => {
    if (e.target === scrollbarThumb) return;
    const rect = scrollbarTrack.getBoundingClientRect();
    const pct = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
    const total = chapters.length;
    if (total === 0) return;
    const targetIndex = Math.round(pct * (total - 1));
    goToIndex(targetIndex);
  });

  let ticking = false, scrollEndTimer = null, isDown = false;
  viewport.addEventListener('scroll', () => {
    if (!ticking){ requestAnimationFrame(() => { updateVisuals(); ticking = false; }); ticking = true; }
    if (isDown) return;
    clearTimeout(scrollEndTimer);
    scrollEndTimer = setTimeout(() => { scrollToIndex(centerIndex, true); }, 380);
  });
  window.addEventListener('resize', () => { setEdgePadding(); updateVisuals(); });

  let startX = 0, startScroll = 0, dragMoved = false;
  viewport.addEventListener('mousedown', (e) => {
    isDown = true; dragMoved = false;
    startX = e.pageX; startScroll = viewport.scrollLeft;
    viewport.classList.add('dragging');
  });
  window.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    const dx = e.pageX - startX;
    if (Math.abs(dx) > 4) dragMoved = true;
    viewport.scrollLeft = startScroll - dx;
  });
  window.addEventListener('mouseup', () => {
    if (!isDown) return;
    isDown = false;
    viewport.classList.remove('dragging');
    if (dragMoved) scrollToIndex(centerIndex, true);
    setTimeout(() => { dragMoved = false; }, 50);
  });
  viewport.addEventListener('wheel', (e) => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)){
      e.preventDefault();
      viewport.scrollLeft += e.deltaY;
    }
  }, { passive:false });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight'){ goToIndex(centerIndex+1); }
    if (e.key === 'ArrowLeft'){ goToIndex(centerIndex-1); }
  });

  (async function init(){
    try{
      chapters = await discoverChapters();
      statusMsg.style.display = 'none';
      render();
    }catch(e){
      statusMsg.classList.add('error');
      statusMsg.textContent = e.message || '불러오는 중 문제가 발생했어요.';
      console.error(e);
    }
  })();
})();
</script>

</body>
</html>
